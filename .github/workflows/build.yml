name: APK Builder (Flutter / Android / Web)

# File ini DI-SYNC OTOMATIS oleh bot ke repo GitHub (.github/workflows/build.yml).
# Tidak perlu secret apa pun: bot sendiri yang mengunduh APK dari artifact lalu mengirimnya ke Telegram.
run-name: "build ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID job dari bot (dipakai bot untuk mengenali run ini)"
        required: true
        type: string
      kind:
        description: "auto = deteksi dari isi ZIP, web = bungkus URL jadi APK"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - flutter
          - android
          - web
      build_type:
        description: "release atau debug"
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
      release_tag:
        description: "Tag release GitHub tempat ZIP / ikon diupload"
        required: true
        type: string
      asset_name:
        description: "Nama file ZIP di release (kosong untuk mode web)"
        required: false
        type: string
        default: ""
      icon_name:
        description: "Nama file ikon di release (opsional)"
        required: false
        type: string
        default: ""
      web_url:
        description: "URL website (mode web)"
        required: false
        type: string
        default: ""
      app_name:
        description: "Nama aplikasi (mode web)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IN_KIND: ${{ inputs.kind }}
      IN_BUILD_TYPE: ${{ inputs.build_type }}
      IN_TAG: ${{ inputs.release_tag }}
      IN_ASSET: ${{ inputs.asset_name }}
      IN_ICON: ${{ inputs.icon_name }}
      IN_URL: ${{ inputs.web_url }}
      IN_APP_NAME: ${{ inputs.app_name }}
      IN_JOB: ${{ inputs.job_id }}
    steps:
      - name: Bersihkan ruang disk runner
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # jangan install package "tools" (sudah dihapus Google, bikin sdkmanager exit 1)
          packages: platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0

      - name: Download ZIP / ikon dari Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl workspace output
          if [ -n "$IN_ASSET" ]; then
            gh release download "$IN_TAG" --repo "${{ github.repository }}" --pattern "$IN_ASSET" --dir dl --clobber
            test -s "dl/$IN_ASSET" || { echo "::error::Gagal download asset '$IN_ASSET' dari release '$IN_TAG'"; exit 1; }
            unzip -q -o "dl/$IN_ASSET" -d workspace
            echo "Isi ZIP (maks 4 level):"
            find workspace -maxdepth 4 -type f | sort | head -200
          fi
          if [ -n "$IN_ICON" ]; then
            gh release download "$IN_TAG" --repo "${{ github.repository }}" --pattern "$IN_ICON" --dir dl --clobber || echo "::warning::Ikon tidak bisa diunduh, pakai ikon default"
          fi

      - name: Detect project
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          shallowest() { # $1 = nama file; ambil yang paling dekat ke root, abaikan folder tersembunyi/build
            find workspace -type f -name "$1" -not -path '*/.*' -not -path '*/build/*' -not -path '*/node_modules/*' \
              | awk '{ n=gsub("/","/"); print n, $0 }' | sort -n | head -1 | cut -d' ' -f2-
          }
          TYPE="$IN_KIND"
          if [ "$TYPE" = "auto" ]; then
            if [ -n "$(shallowest pubspec.yaml)" ]; then TYPE=flutter
            elif [ -n "$(shallowest gradlew)" ] || [ -n "$(shallowest settings.gradle)" ] || [ -n "$(shallowest settings.gradle.kts)" ]; then TYPE=android
            elif [ -n "$(find workspace -type f -iname '*.html' -print -quit)" ]; then TYPE=webzip
            else TYPE=unknown; fi
          fi
          echo "Tipe project: $TYPE"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          if [ "$TYPE" = "flutter" ]; then
            P="$(shallowest pubspec.yaml)"; [ -n "$P" ] || { echo "::error::pubspec.yaml tidak ditemukan di ZIP."; exit 1; }
            echo "FLUTTER_PROJECT=$(dirname "$P")" >> "$GITHUB_ENV"
          elif [ "$TYPE" = "android" ]; then
            G="$(shallowest gradlew)"
            if [ -z "$G" ]; then G="$(shallowest settings.gradle)"; fi
            if [ -z "$G" ]; then G="$(shallowest settings.gradle.kts)"; fi
            [ -n "$G" ] || { echo "::error::Project Android tidak ditemukan di ZIP."; exit 1; }
            echo "ANDROID_PROJECT=$(dirname "$G")" >> "$GITHUB_ENV"
          elif [ "$TYPE" = "unknown" ]; then
            echo "::error::ZIP tidak berisi project Flutter, Android, atau Web (HTML)."
            exit 1
          fi

      # ───────────────────────── FLUTTER ─────────────────────────
      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder android (jika belum ada)
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            echo "Folder android/ tidak ada, membuat dengan flutter create..."
            flutter create . --platforms=android
          fi

      - name: Samakan versi Gradle / AGP / Kotlin + bersihkan properti deprecated
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          # 1) Gradle wrapper → versi stabil yang kompatibel dengan AGP 8.x
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip#' "$WRAPPER"
            grep distributionUrl "$WRAPPER" || true
          fi

          # 2) Paksa AGP & Kotlin ke versi yang didukung Flutter stable saat ini
          MIN_AGP="8.7.3"
          MIN_KOTLIN="2.0.21"
          for FILE in android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts; do
            [ -f "$FILE" ] || continue
            sed -i -E "s#(id\(?[\"']com\.android\.application[\"']\)? version ?[\"'])[0-9.]+([\"'])#\1${MIN_AGP}\2#" "$FILE" || true
            sed -i -E "s#(classpath ?[\"']com\.android\.tools\.build:gradle:)[0-9.]+([\"'])#\1${MIN_AGP}\2#" "$FILE" || true
            sed -i -E "s#(id\(?[\"']org\.jetbrains\.kotlin\.android[\"']\)? version ?[\"'])[0-9.]+([\"'])#\1${MIN_KOTLIN}\2#" "$FILE" || true
            sed -i -E "s#(ext\.kotlin_version ?= ?[\"'])[0-9.]+([\"'])#\1${MIN_KOTLIN}\2#" "$FILE" || true
            sed -i -E "s#(classpath ?[\"']org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9.]+([\"'])#\1${MIN_KOTLIN}\2#" "$FILE" || true
          done

          # 3) HAPUS opsi yang sudah dihapus di AGP 7+ (penyebab error "android.enableR8 is deprecated")
          if [ -f android/gradle.properties ]; then
            sed -i -E \
              -e '/^[[:space:]]*android\.enableR8[[:space:]]*=/d' \
              -e '/^[[:space:]]*android\.enableD8[[:space:]]*=/d' \
              -e '/^[[:space:]]*android\.enableBuildCache[[:space:]]*=/d' \
              -e '/^[[:space:]]*android\.enableSeparateAnnotationProcessing[[:space:]]*=/d' \
              -e '/^[[:space:]]*android\.enableIncremental[[:space:]]*=/d' \
              android/gradle.properties
            # Pastikan properti wajib ada
            grep -q 'android.useAndroidX' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
            grep -q 'android.enableJetifier' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties
            # Hindari warning R8 full mode di beberapa project lama
            grep -q 'android.enableR8.fullMode' android/gradle.properties || echo 'android.enableR8.fullMode=false' >> android/gradle.properties
            echo "--- android/gradle.properties setelah dibersihkan ---"
            cat android/gradle.properties || true
          fi

          # 4) Naikkan compileSdk / targetSdk / minSdk di app/build.gradle(.kts) bila terlalu rendah
          for APPG in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$APPG" ] || continue
            # compileSdk / compileSdkVersion
            sed -i -E 's/compileSdk(Version)?[[:space:]]*[:=]?[[:space:]]*[0-9]+/compileSdk 35/g' "$APPG" || true
            sed -i -E 's/targetSdk(Version)?[[:space:]]*[:=]?[[:space:]]*[0-9]+/targetSdk 35/g' "$APPG" || true
            # minSdk minimal 21 (Flutter default modern)
            sed -i -E 's/minSdk(Version)?[[:space:]]*[:=]?[[:space:]]*[0-9]+/minSdk 21/g' "$APPG" || true
            # namespace wajib di AGP 8+
            if ! grep -qE 'namespace[[:space:]]' "$APPG"; then
              # coba ambil dari AndroidManifest package
              PKG=$(grep -oE 'package="[^"]+"' android/app/src/main/AndroidManifest.xml 2>/dev/null | head -1 | cut -d'"' -f2 || true)
              if [ -n "$PKG" ]; then
                if [[ "$APPG" == *.kts ]]; then
                  sed -i "s/android[[:space:]]*{/android {\n    namespace = \"$PKG\"/" "$APPG" || true
                else
                  sed -i "s/android[[:space:]]*{/android {\n    namespace \"$PKG\"/" "$APPG" || true
                fi
              fi
            fi
          done

          # 5) Hapus local.properties yang berisi path mesin developer (bisa bikin error di CI)
          rm -f android/local.properties || true

      - name: Flutter pub get (dengan fallback)
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          # Coba pub get biasa dulu
          if ! flutter pub get; then
            echo "::warning::flutter pub get gagal, coba pub upgrade --major-versions lalu get lagi"
            flutter pub upgrade --major-versions || true
            flutter pub get
          fi
          # Beberapa project punya dependency constraint ketat; longgarkan lewat override jika perlu
          if [ -f pubspec.yaml ] && grep -q 'dependency_overrides:' pubspec.yaml; then
            echo "dependency_overrides sudah ada"
          fi

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          # Bersihkan cache build lama yang sering bikin conflict
          flutter clean || true
          flutter pub get
          if [ "$IN_BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --no-tree-shake-icons || flutter build apk --debug
          else
            flutter build apk --release --no-tree-shake-icons || flutter build apk --release
          fi
      - name: Kumpulkan APK Flutter
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$FLUTTER_PROJECT/build/app/outputs/flutter-apk" -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "::error::APK Flutter tidak ditemukan."; exit 1; }
          cp "$APK" output/app-release.apk

      # ───────────────────────── ANDROID NATIVE ─────────────────────────
      - name: Build Android native
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradlew / wrapper jar tidak lengkap, regenerasi wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew
          if [ "$IN_BUILD_TYPE" = "debug" ]; then ./gradlew assembleDebug --no-daemon --stacktrace; else ./gradlew assembleRelease --no-daemon --stacktrace; fi

      - name: Kumpulkan APK Android
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          V=release; [ "$IN_BUILD_TYPE" = "debug" ] && V=debug
          APK="$(find "$ANDROID_PROJECT" -type f -path "*/build/outputs/apk/$V/*" -name '*.apk' -print -quit)"
          [ -n "$APK" ] || APK="$(find "$ANDROID_PROJECT" -type f -path '*/build/outputs/apk/*' -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "::error::APK Android tidak ditemukan."; exit 1; }
          if [ "$V" = "debug" ]; then cp "$APK" output/app-release.apk; else cp "$APK" output/app-unsigned.apk; fi

      # ───────────────────────── WEB (URL / ZIP HTML) ─────────────────────────
      - name: Buat project WebView
        if: steps.detect.outputs.type == 'web' || steps.detect.outputs.type == 'webzip'
        shell: bash
        env:
          WEB_TYPE: ${{ steps.detect.outputs.type }}
        run: |
          set -euo pipefail
          if [ "$IN_KIND" = "web" ]; then
            [ -n "$IN_URL" ] || { echo "::error::web_url kosong."; exit 1; }
          fi

          mkdir -p webview/app/src/main/java/app/webview webview/app/src/main/res/values webview/app/src/main/assets

          START_URL="$IN_URL"
          LABEL="$IN_APP_NAME"
          if [ "$WEB_TYPE" = "webzip" ]; then
            INDEX=""
            for NAME in index.html splash.html login.html dashboard.html; do
              F="$(find workspace -type f -iname "$NAME" -print -quit)"
              if [ -n "$F" ]; then INDEX="$F"; break; fi
            done
            [ -n "$INDEX" ] || INDEX="$(find workspace -type f -iname '*.html' -print -quit)"
            WEB_ROOT="$(dirname "$INDEX")"
            cp -r "$WEB_ROOT"/. webview/app/src/main/assets/
            if [ "$(basename "$INDEX")" != "index.html" ]; then cp "$INDEX" webview/app/src/main/assets/index.html; fi
            START_URL="file:///android_asset/index.html"
          fi
          [ -n "$LABEL" ] || LABEL="Web App"

          cat > "$RUNNER_TEMP/icon.py" <<'PY'
          import sys
          from PIL import Image
          im = Image.open(sys.argv[1]).convert("RGBA")
          im.thumbnail((512, 512))
          im.save(sys.argv[2], "PNG")
          PY

          # ikon opsional
          ICON_ATTR=""
          if [ -n "$IN_ICON" ] && [ -s "dl/$IN_ICON" ]; then
            mkdir -p webview/app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1 && convert "dl/$IN_ICON[0]" -resize 512x512 -background none -gravity center -extent 512x512 webview/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null; then
              ICON_ATTR='android:icon="@mipmap/ic_launcher"'
            elif python3 -c "import PIL" 2>/dev/null && python3 "$RUNNER_TEMP/icon.py" "dl/$IN_ICON" webview/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; then
              ICON_ATTR='android:icon="@mipmap/ic_launcher"'
            else
              echo "::warning::Tidak bisa memproses ikon, pakai ikon default."
              rm -rf webview/app/src/main/res/mipmap-xxxhdpi
            fi
          fi

          # tulis file yang memuat input user lewat python (aman dari injeksi shell / XML / Java)
          START_URL="$START_URL" LABEL="$LABEL" ICON_ATTR="$ICON_ATTR" python3 - <<'PY'
          import os
          from xml.sax.saxutils import escape, quoteattr
          url = os.environ["START_URL"]; label = os.environ["LABEL"]; icon = os.environ["ICON_ATTR"]
          base = "webview/app/src/main/"
          def jstr(s): return s.replace("\\", "\\\\").replace('"', '\\"').replace("\n", " ").replace("\r", " ")
          open(base + "AndroidManifest.xml", "w", encoding="utf-8").write(f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label={quoteattr(label)}
                  {icon}
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')
          open(base + "res/values/styles.xml", "w", encoding="utf-8").write('''<resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          ''')
          open(base + "java/app/webview/MainActivity.java", "w", encoding="utf-8").write('''package app.webview;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("http") || u.startsWith("file:")) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); } catch (Exception e) { }
                          return true;
                      }
                  });
                  setContentView(webView);
                  if (savedInstanceState != null) webView.restoreState(savedInstanceState);
                  else webView.loadUrl("''' + jstr(url) + '''");
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  webView.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
          }
          ''')
          PY

          cat > webview/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebToApk"
          include(":app")
          EOF
          cat > webview/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > webview/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          cat > webview/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'app.webview'
              compileSdk 35
              defaultConfig {
                  applicationId 'app.webview.apk'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF
          cd webview
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..
          APK="$(find webview/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo "::error::APK WebView tidak ditemukan."; exit 1; }
          cp "$APK" output/app-unsigned.apk

      # ───────────────────────── SIGN (Android native & Web, release) ─────────────────────────
      - name: Sign APK release
        if: success() && (steps.detect.outputs.type == 'android' || steps.detect.outputs.type == 'web' || steps.detect.outputs.type == 'webzip') && env.IN_BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f output/app-unsigned.apk ] || { echo "::error::[SIGN] output/app-unsigned.apk tidak ditemukan."; ls -la output; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$(ls -d "$SDK_ROOT"/build-tools/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/*$::')"
          [ -x "$BT/zipalign" ] && [ -x "$BT/apksigner" ] || { echo "::error::[SIGN] build-tools tidak ditemukan di $SDK_ROOT"; exit 1; }

          KS_FILE="release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "[SIGN] Memakai keystore dari secret repo"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_FILE"
            KS_PASS="$KEYSTORE_PASSWORD"; KS_ALIAS="$KEY_ALIAS"; KEY_PASS="$KEY_PASSWORD"
          else
            echo "[SIGN] Secret keystore tidak ada, memakai debug keystore otomatis"
            KS_PASS="android"; KS_ALIAS="androiddebugkey"; KEY_PASS="android"
            keytool -genkeypair -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KS_ALIAS" -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          [ -s "$KS_FILE" ] || { echo "::error::[SIGN] keystore kosong / tidak valid."; exit 1; }

          "$BT/zipalign" -f 4 output/app-unsigned.apk output/aligned.apk
          "$BT/apksigner" sign --ks "$KS_FILE" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out output/app-release.apk output/aligned.apk
          "$BT/apksigner" verify --verbose output/app-release.apk
          rm -f "$KS_FILE" output/aligned.apk output/app-unsigned.apk
          ls -la output

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}
          path: output/app-release.apk
          if-no-files-found: error
          retention-days: 3
