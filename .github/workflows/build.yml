name: Build APK
run-name: "Build #${{ inputs.job_id }} (${{ inputs.kind }})"

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "flutter | web"
        required: true
        type: string
      source:
        description: "file_id ZIP (flutter) atau URL website (web)"
        required: true
        type: string
      build_type:
        description: "debug | release"
        required: true
        default: "release"
        type: string
      chat_id:
        required: true
        type: string
      message_id:
        required: true
        type: string
      job_id:
        required: true
        type: string
      app_name:
        required: false
        default: ""
        type: string
      icon_id:
        required: false
        default: ""
        type: string
      user_label:
        required: false
        default: ""
        type: string
      log_chat:
        required: false
        default: ""
        type: string

permissions:
  contents: read

# KEAMANAN: kode project user hanya berjalan di job "build" yang TANPA secret.
#   prepare -> punya secret, hanya mengunduh file
#   build   -> TANPA secret, menjalankan flutter/gradle milik user
#   deliver -> punya secret, hanya mengirim hasil

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAT_ID: ${{ inputs.chat_id }}
      MESSAGE_ID: ${{ inputs.message_id }}
      JOB_ID: ${{ inputs.job_id }}
      KIND: ${{ inputs.kind }}
      SOURCE: ${{ inputs.source }}
      BUILD_TYPE: ${{ inputs.build_type }}
      APP_NAME: ${{ inputs.app_name }}
      ICON_ID: ${{ inputs.icon_id }}
      USER_LABEL: ${{ inputs.user_label }}
      LOG_CHAT: ${{ inputs.log_chat }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validasi input
        run: |
          [[ "$KIND" =~ ^(flutter|web)$ ]] || { echo "kind salah"; exit 1; }
          [[ "$BUILD_TYPE" =~ ^(debug|release)$ ]] || { echo "build_type salah"; exit 1; }
          [[ "$CHAT_ID" =~ ^-?[0-9]+$ && "$MESSAGE_ID" =~ ^[0-9]+$ ]] || { echo "chat/message id salah"; exit 1; }
          [[ "$JOB_ID" =~ ^[A-Za-z0-9]+$ ]] || { echo "job_id salah"; exit 1; }
          [[ "$ICON_ID" =~ ^[A-Za-z0-9_-]*$ ]] || { echo "icon_id salah"; exit 1; }
          if [ "$KIND" = "web" ]; then
            [[ "$SOURCE" =~ ^https?://[^[:space:]]+$ ]] || { echo "URL tidak valid"; exit 1; }
            [ -n "$APP_NAME" ] || { echo "nama app kosong"; exit 1; }
          else
            [[ "$SOURCE" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "file_id salah"; exit 1; }
          fi

      - name: Notif mulai
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          source scripts/tg.sh
          progress 10 "Runner siap, menyiapkan file…"
          notify_admin "$(em build 🛠) <b>Build Dimulai</b> <code>#${JOB_ID}</code>
          <blockquote>$(em user 👤) $(user_label)
          $(em package 📦) $(kind_label)</blockquote>"

      - name: Ambil file dari Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          source scripts/tg.sh
          mkdir -p work
          echo "$JOB_ID" > work/info.txt
          if [ "$KIND" = "flutter" ]; then
            progress 20 "Mengunduh ZIP project (maks 100 MB)…"
            if start_local_api; then
              local_download "$SOURCE" work/source.zip || { echo "Unduh via Local Bot API gagal"; exit 1; }
            else
              echo "TG_API_ID/TG_API_HASH tidak ada -> pakai Bot API biasa (maks 20 MB)"
              cloud_download "$SOURCE" work/source.zip || { echo "Unduh gagal (ZIP > 20 MB butuh TG_API_ID & TG_API_HASH)"; exit 1; }
            fi
            SZ=$(stat -c%s work/source.zip)
            echo "Ukuran ZIP: $SZ byte"
            [ "$SZ" -le 104857600 ] || { echo "ZIP > 100 MB"; exit 1; }
          elif [ -n "$ICON_ID" ]; then
            progress 20 "Mengunduh ikon…"
            cloud_download "$ICON_ID" work/icon.bin || echo "Ikon gagal diunduh, pakai ikon default"
          fi
          ls -la work

      - name: Notif build
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          source scripts/tg.sh
          progress 40 "File siap. Proses build berjalan (bisa beberapa menit)…"

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: work/
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

      - name: Notif gagal (prepare)
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          source scripts/tg.sh
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          KB=$(jq -cn --argjson a "$(kbtn "Lihat Log" "📋" link "$RUN_URL" primary)" '{inline_keyboard:[[$a]]}')
          tg_edit "$(em fail ❌) <b>Gagal menyiapkan file</b> <code>#${JOB_ID}</code>
          <blockquote>ZIP &gt; 20 MB butuh secret <code>TG_API_ID</code> &amp; <code>TG_API_HASH</code>. Cek juga link/file yang dikirim.</blockquote>" "$KB"
          notify_admin "$(em fail ❌) <b>Build Gagal (persiapan)</b> <code>#${JOB_ID}</code>
          <blockquote>$(em user 👤) $(user_label)</blockquote>"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND: ${{ inputs.kind }}
      BUILD_TYPE: ${{ inputs.build_type }}
      APP_NAME: ${{ inputs.app_name }}
      WEB_URL: ${{ inputs.source }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: source
          path: .

      - name: Validasi project Flutter
        if: inputs.kind == 'flutter'
        run: |
          fail() { echo "$1" | tee reason.txt; cp reason.txt build.log; exit 1; }
          mkdir src
          unzip -q source.zip -d src || fail "File ZIP rusak / tidak bisa diekstrak."
          P=$(find src -maxdepth 3 -name pubspec.yaml -not -path '*/__MACOSX/*' | awk '{print length($0), $0}' | sort -n | head -1 | cut -d' ' -f2-)
          [ -n "$P" ] || fail "pubspec.yaml tidak ditemukan. ZIP wajib berisi project Flutter."
          grep -Eq '^[[:space:]]+sdk:[[:space:]]*flutter' "$P" || fail "pubspec.yaml bukan project Flutter (tidak ada 'sdk: flutter')."
          D=$(dirname "$P")
          [ -d "$D/lib" ] || fail "Folder lib/ tidak ditemukan."
          [ -d "$D/android" ] || fail "Folder android/ tidak ditemukan (jalankan 'flutter create --platforms=android .' lalu zip ulang)."
          PUB=$(grep -m1 -E '^name:' "$P" | awk '{print $2}' | tr -cd 'A-Za-z0-9_-')
          echo "PROJ_DIR=$GITHUB_WORKSPACE/$D" >> "$GITHUB_ENV"
          echo "PUB_NAME=${PUB:-flutter_app}" >> "$GITHUB_ENV"
          echo "Project Flutter valid: $D"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: subosito/flutter-action@v2
        if: inputs.kind == 'flutter'
        with:
          channel: stable
          cache: false

      - uses: gradle/actions/setup-gradle@v4
        if: inputs.kind == 'web'
        with:
          gradle-version: "8.10.2"
          cache-disabled: true

      - name: Build Flutter
        if: inputs.kind == 'flutter'
        run: |
          cd "$PROJ_DIR"
          flutter config --no-analytics >/dev/null 2>&1 || true
          flutter --version 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          flutter pub get 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          flutter build apk "--$BUILD_TYPE" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Build Web to APK
        if: inputs.kind == 'web'
        run: |
          command -v convert >/dev/null 2>&1 || command -v magick >/dev/null 2>&1 || sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          python3 scripts/gen_webapp.py 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          cd webproj
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Kumpulkan APK
        run: |
          if [ "$KIND" = "flutter" ]; then SEARCH="$PROJ_DIR"; NAME="$PUB_NAME"
          else SEARCH="$GITHUB_WORKSPACE/webproj"; NAME=$(printf '%s' "$APP_NAME" | tr -cd 'A-Za-z0-9_-' | head -c 30); NAME="${NAME:-webapp}"; fi
          APK=$(find "$SEARCH" -path '*build/*outputs*' -name '*.apk' -not -path '*androidTest*' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          [ -n "$APK" ] || { echo "APK tidak ditemukan setelah build"; exit 1; }
          mkdir -p out
          cp "$APK" out/raw.apk
          printf '%s' "$NAME" > out/name.txt
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/
          retention-days: 1
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildlog
          path: |
            build.log
            reason.txt
          retention-days: 1
          if-no-files-found: ignore

  deliver:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHAT_ID: ${{ inputs.chat_id }}
      MESSAGE_ID: ${{ inputs.message_id }}
      JOB_ID: ${{ inputs.job_id }}
      KIND: ${{ inputs.kind }}
      SOURCE: ${{ inputs.source }}
      BUILD_TYPE: ${{ inputs.build_type }}
      USER_LABEL: ${{ inputs.user_label }}
      LOG_CHAT: ${{ inputs.log_chat }}
      BUILD_RESULT: ${{ needs.build.result }}
      RUN_STARTED: ${{ github.run_started_at }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: apk
          path: dl

      - uses: actions/download-artifact@v4
        if: needs.build.result != 'success'
        continue-on-error: true
        with:
          name: buildlog
          path: logdl

      - name: Siapkan file final
        if: needs.build.result == 'success'
        run: |
          mkdir -p final
          NAME=$(cat dl/name.txt)
          if [ "$KIND" = "web" ]; then OUT="final/${NAME}.apk"; else OUT="final/${NAME}-${BUILD_TYPE}.apk"; fi
          cp dl/raw.apk "$OUT"
          ls -lh final

      - uses: actions/upload-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: apk-${{ inputs.job_id }}
          path: final/*.apk
          retention-days: 7
          compression-level: 0

      - name: Kirim hasil ke Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          source scripts/tg.sh
          DUR=$(( $(date +%s) - $(date -d "$RUN_STARTED" +%s) ))
          DURH="$((DUR/60))m $((DUR%60))s"
          RUNBTN=$(kbtn "Lihat Run" "📋" link "$RUN_URL" primary)

          if [ "$BUILD_RESULT" = "success" ]; then
            F=$(ls final/*.apk | head -1)
            BYTES=$(stat -c%s "$F"); SIZE=$(numfmt --to=iec "$BYTES")
            SHA=$(sha256sum "$F" | cut -c1-16)
            NAME=$(basename "$F" | esc)
            progress 90 "Mengunggah APK ke Telegram…"
            if start_local_api; then FILE_API="$LOCAL_API"; else FILE_API="$API_CLOUD"; fi
            if tg_send_doc "$F"; then
              KB=$(jq -cn --argjson a "$(cbtn "Build Lagi" "🔁" rocket h:new success)" --argjson b "$RUNBTN" '{inline_keyboard:[[$a,$b]]}')
              tg_edit "$(em ok ✅) <b>Build Berhasil!</b> <code>#${JOB_ID}</code>
          <blockquote>$(em package 📦) <code>${NAME}</code>
          $(em build 🛠) Mode: <b>$(kind_label)</b>
          💾 Ukuran: <b>${SIZE}</b>
          🔐 SHA256: <code>${SHA}…</code>
          $(em clock ⏱) Durasi: <b>${DURH}</b></blockquote>
          $(em rocket 🚀) <i>File APK dikirim di bawah ⬇️</i>" "$KB"
              notify_admin "$(em ok ✅) <b>Build Selesai</b> <code>#${JOB_ID}</code>
          <blockquote>$(em user 👤) $(user_label)
          $(em package 📦) $(kind_label) · ${SIZE} · ${DURH}</blockquote>"
            else
              KB=$(jq -cn --argjson a "$RUNBTN" '{inline_keyboard:[[$a]]}')
              tg_edit "$(em fail ⚠️) <b>Build berhasil, tapi gagal mengirim APK</b> <code>#${JOB_ID}</code>
          <blockquote>💾 ${SIZE}. Unduh dari Artifact di halaman Run. File &gt; 50 MB butuh secret <code>TG_API_ID</code> &amp; <code>TG_API_HASH</code>.</blockquote>" "$KB"
              notify_admin "$(em fail ⚠️) <b>Build OK, kirim gagal</b> <code>#${JOB_ID}</code>"
            fi
          else
            KB=$(jq -cn --argjson a "$RUNBTN" --argjson b "$(cbtn "Coba Lagi" "🔁" rocket h:new success)" '{inline_keyboard:[[$b,$a]]}')
            if [ "$BUILD_RESULT" = "cancelled" ]; then
              tg_edit "$(em fail ✖️) <b>Build dibatalkan</b> <code>#${JOB_ID}</code>" "$KB"
              notify_admin "$(em fail ✖️) <b>Build Dibatalkan</b> <code>#${JOB_ID}</code>"
            elif [ -f logdl/reason.txt ]; then
              REASON=$(head -c 400 logdl/reason.txt | esc)
              tg_edit "$(em fail ❌) <b>Build Ditolak</b> <code>#${JOB_ID}</code>
          <blockquote>${REASON}</blockquote>" "$KB"
              notify_admin "$(em fail ❌) <b>Build Ditolak</b> <code>#${JOB_ID}</code>
          <blockquote>$(user_label)
          ${REASON}</blockquote>"
            else
              LOG=logdl/build.log; TAIL="(log tidak tersedia)"
              if [ -f "$LOG" ]; then
                if grep -Eq 'What went wrong|Error:|error:' "$LOG"; then TAIL=$(grep -E -A6 -m1 'What went wrong|Error:|error:' "$LOG")
                else TAIL=$(tail -n 12 "$LOG"); fi
              fi
              TAIL=$(printf '%s' "$TAIL" | cut -c1-150 | head -n 12 | esc)
              tg_edit "$(em fail ❌) <b>Build Gagal</b> <code>#${JOB_ID}</code>
          <blockquote>$(em clock ⏱) Durasi: ${DURH}</blockquote>
          <pre>${TAIL}</pre>" "$KB"
              notify_admin "$(em fail ❌) <b>Build Gagal</b> <code>#${JOB_ID}</code>
          <blockquote>$(user_label) · $(kind_label)</blockquote>"
            fi
          fi
